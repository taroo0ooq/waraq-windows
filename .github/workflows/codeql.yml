# WRQ-WIN-002 Phase 1 — SAST (CodeQL) for src/ C#
name: codeql

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      - name: Build solution for analysis
        working-directory: src
        run: |
          dotnet restore Waraq.Windows.sln
          dotnet build Waraq.Windows.Core/Waraq.Windows.Core.csproj -c Release --no-restore
          dotnet build Waraq.Windows.Host/Waraq.Windows.Host.csproj -c Release --no-restore
          dotnet build Waraq.Windows.Engines/Waraq.Windows.Engines.csproj -c Release --no-restore
          dotnet build Waraq.Windows.Shell/Waraq.Windows.Shell.csproj -c Release --no-restore
          dotnet build Waraq.Windows.App/Waraq.Windows.App.csproj -c Release -p:Platform=x64 --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
