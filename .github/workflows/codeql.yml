# WRQ-WIN-001 Phase 1b — SAST (CodeQL) for Windows C# scaffold
# Additive; does not replace macOS Swift lint tooling.
name: codeql

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/codeql.yml"
  schedule:
    # Weekly baseline even if path filters skip pushes
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      - name: Build solution for analysis
        working-directory: windows
        run: |
          dotnet restore WaraqWindows.sln
          dotnet build WaraqWindows.sln -c Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
