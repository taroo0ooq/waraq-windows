# WRQ-WIN-001 — DAST gate (explicit N/A until network surface exists)
# Standing policy: workflow must exist; N/A is an allowed green outcome with documentation.
#
# Hardening (Phase 6-fix / Atlas Forge):
# - cancel-in-progress: false — rapid pushes must NOT cancel an in-flight DAST gate
#   (cancelled required checks show FAIL/UNSTABLE on the PR even when the job body is fine).
# - Short timeout; pure doc verification; no external scanners while Status is N/A.
name: dast

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/dast.yml"
      - "docs/security/**"
  pull_request:
    branches: [main]
    # Always evaluate DAST on PRs targeting main (required check must not be skipped/cancelled).
  workflow_dispatch:

concurrency:
  # One logical group per PR/ref, but never cancel a run that already started.
  group: dast-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dast-gate:
    name: DAST gate (N/A until network surface)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify DAST posture document
        run: |
          set -euo pipefail
          DOC="docs/security/DAST.md"
          if [ ! -f "$DOC" ]; then
            echo "::error::Missing $DOC — DAST posture must be documented"
            exit 1
          fi
          if ! grep -qiE 'status:\s*(N/A|NA|not applicable)|\*\*Status\*\*.*\*\*N/A\*\*' "$DOC"; then
            echo "::error::$DOC must declare Status: N/A (or Not applicable) while no network attack surface exists"
            exit 1
          fi
          echo "DAST posture document present:"
          sed -n '1,100p' "$DOC"

      - name: Gate result
        run: |
          {
            echo "## DAST result: N/A (documented)"
            echo ""
            echo "No HTTP/network listener is exposed by the Windows app (local WPF desktop)."
            echo "Dynamic application security testing is deferred until a network surface exists."
            echo "See \`docs/security/DAST.md\`."
            echo ""
            echo "Workflow policy: cancel-in-progress=false so this required check is not cancelled by superseding pushes."
          } >> "$GITHUB_STEP_SUMMARY"
