# WRQ-WIN-001 Phase 4 — QA gate (Stagecraft QA)
# Browser Playwright is N/A for WPF desktop. This workflow is the required "playwright"
# GitHub check name and now runs a real Windows QA smoke: build, unit/integration tests,
# fixture generation, and residual-risk summary. Not an empty stub.
name: playwright

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "e2e/**"
      - ".github/workflows/playwright.yml"
  pull_request:
    branches: [main]
    paths:
      - "windows/**"
      - "e2e/**"
      - ".github/workflows/playwright.yml"
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-qa-smoke:
    name: Windows QA smoke (WPF / WorkerW)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup FFmpeg (fixtures)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Run Windows QA smoke script
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          ./e2e/windows-qa-smoke.ps1 -Configuration Release

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-qa-smoke-results
          path: |
            e2e/out/**
            windows/**/TestResults/**
          if-no-files-found: ignore

  browser-playwright-na:
    name: Browser Playwright N/A (documented)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Residual risk — no web surface
        run: |
          set -euo pipefail
          {
            echo "## Browser Playwright: N/A"
            echo ""
            echo "Waraq Windows MVP is **WPF desktop** (WorkerW + MediaElement/GIF)."
            echo "There is **no browser UI** in scope for WRQ-WIN-001 Phase 4."
            echo ""
            echo "| Item | Status |"
            echo "|------|--------|"
            echo "| Browser Playwright specs | N/A — not applicable |"
            echo "| Windows QA smoke (sibling job) | Required real gate |"
            echo "| Full WinAppDriver/FlaUI UI drive | Deferred residual (see docs/qa) |"
            echo ""
            echo "This job exits 0 as an explicit N/A documentation gate so the workflow"
            echo "name \`playwright\` remains a hard required check without fake browser runs."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test -f e2e/README.md
          test -f docs/qa/WRQ-WIN-001-phase4-qa-matrix.md || test -f e2e/README.md
