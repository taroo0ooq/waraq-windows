# WRQ-WIN-002 Phase 1 — QA smoke for src/ WinUI scaffold
# Required check name remains "playwright" for branch protection continuity.
name: playwright

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - ".github/workflows/playwright.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - ".github/workflows/playwright.yml"
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-qa-smoke:
    name: Windows QA smoke (WinUI scaffold)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore + build + test
        working-directory: src
        run: |
          dotnet restore Waraq.Windows.sln
          dotnet build Waraq.Windows.Tests/Waraq.Windows.Tests.csproj -c Release --no-restore
          dotnet test Waraq.Windows.Tests/Waraq.Windows.Tests.csproj -c Release --no-build --verbosity minimal
          dotnet build Waraq.Windows.App/Waraq.Windows.App.csproj -c Release -p:Platform=x64 --no-restore

      - name: Residual risk summary
        run: |
          echo "## WRQ-WIN-002 Phase 1 smoke" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "- WinUI 3 unpackaged app builds (x64)." >> $env:GITHUB_STEP_SUMMARY
          echo "- Unit tests for path gate / classifier / host probe." >> $env:GITHUB_STEP_SUMMARY
          echo "- No live WorkerW attach yet (Phase 3)." >> $env:GITHUB_STEP_SUMMARY
          echo "- Browser Playwright N/A for desktop WinUI." >> $env:GITHUB_STEP_SUMMARY

  browser-playwright-na:
    name: Browser Playwright N/A (documented)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "Browser Playwright is N/A for WinUI desktop." >> "$GITHUB_STEP_SUMMARY"
          echo "Windows QA smoke job is the real gate." >> "$GITHUB_STEP_SUMMARY"
