# WRQ-WIN-002 Phase 1 — QA smoke for src/ WinUI (Stagecraft Phase 3-QA)
# Required check name remains "playwright" for branch protection continuity.
name: playwright

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - ".github/workflows/playwright.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - ".github/workflows/playwright.yml"
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-qa-smoke:
    name: Windows QA smoke (WinUI Host)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore + build + test + app
        working-directory: src
        run: |
          dotnet restore Waraq.Windows.sln
          dotnet build Waraq.Windows.Tests/Waraq.Windows.Tests.csproj -c Release --no-restore
          dotnet test Waraq.Windows.Tests/Waraq.Windows.Tests.csproj -c Release --no-build --verbosity normal --logger "trx;LogFileName=phase3-qa-ci.trx"
          dotnet build Waraq.Windows.App/Waraq.Windows.App.csproj -c Release -p:Platform=x64 --no-restore

      - name: Residual risk summary
        run: |
          echo "## WRQ-WIN-002 Phase 3-QA smoke" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "- WinUI 3 unpackaged app builds (x64)." >> $env:GITHUB_STEP_SUMMARY
          echo "- Unit tests: path gate (UNC/URL/size), classifier, WorkerW probe, virtual screen." >> $env:GITHUB_STEP_SUMMARY
          echo "- Host Apply/Stop wired in app; interactive visual Apply = soft residual." >> $env:GITHUB_STEP_SUMMARY
          echo "- Tray Stop wallpaper code path: CMD_PAUSE -> App.Wallpaper.Stop." >> $env:GITHUB_STEP_SUMMARY
          echo "- Browser Playwright N/A for desktop WinUI." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-qa-trx
          path: src/**/TestResults/**
          if-no-files-found: ignore

  browser-playwright-na:
    name: Browser Playwright N/A (documented)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Residual risk — no web surface
        run: |
          {
            echo "## Browser Playwright: N/A"
            echo ""
            echo "Waraq Windows is **WinUI desktop** (WorkerW host). No browser UI in WRQ-WIN-002 Phase 3."
            echo "Windows QA smoke sibling job is the real gate."
          } >> "$GITHUB_STEP_SUMMARY"
