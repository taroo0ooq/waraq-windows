# WRQ-WIN-002 Phase 1 — Windows build + test for src/ (WinUI 3)
name: windows-ci

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and Test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show toolchain
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Restore
        working-directory: src
        run: dotnet restore Waraq.Windows.sln

      - name: Build libraries + tests
        working-directory: src
        run: |
          dotnet build Waraq.Windows.Core/Waraq.Windows.Core.csproj -c Release --no-restore
          dotnet build Waraq.Windows.Host/Waraq.Windows.Host.csproj -c Release --no-restore
          dotnet build Waraq.Windows.Engines/Waraq.Windows.Engines.csproj -c Release --no-restore
          dotnet build Waraq.Windows.Shell/Waraq.Windows.Shell.csproj -c Release --no-restore
          dotnet build Waraq.Windows.Tests/Waraq.Windows.Tests.csproj -c Release --no-restore

      - name: Build WinUI App (x64)
        working-directory: src
        run: dotnet build Waraq.Windows.App/Waraq.Windows.App.csproj -c Release -p:Platform=x64 --no-restore

      - name: Test
        working-directory: src
        run: dotnet test Waraq.Windows.Tests/Waraq.Windows.Tests.csproj -c Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results-src
          path: src/**/TestResults/**
          if-no-files-found: ignore
