# WRQ-WIN-002 Phase 9 — Windows release packaging + installer (Ship)
# Portable zip + Inno Setup for src/ WinUI 3 app, self-signed Authenticode.
name: windows-release

on:
  push:
    tags:
      - "win-v*"
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: "Create a draft GitHub Release (workflow_dispatch only; tags always draft-release)"
        type: boolean
        default: false
      version_suffix:
        description: "Optional version label override (default: Directory.Build.props + run number)"
        type: string
        required: false
        default: ""

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    name: Package zip + signed installer (src WinUI)
    runs-on: windows-latest
    timeout-minutes: 75

    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      setup_name: ${{ steps.meta.outputs.setup_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version metadata
        id: meta
        shell: pwsh
        run: |
          $refName = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF -like 'refs/tags/win-v*') {
            $version = $refName.Substring(5)
          } elseif ('${{ inputs.version_suffix }}') {
            $version = '${{ inputs.version_suffix }}'
          } else {
            [xml]$xml = Get-Content src/Directory.Build.props
            $base = @($xml.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
            if (-not $base) { $base = "0.9.0-phase9" }
            $version = "$base+$env:GITHUB_RUN_NUMBER"
          }
          $safe = ($version -replace '[\\/:\s\+]', '-')
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=Waraq.Windows-win-x64-$safe" >> $env:GITHUB_OUTPUT
          "setup_name=Waraq.Windows-Setup-win-x64-$safe" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version safe=$safe"

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe missing after choco install" }
          Write-Host "ISCC=$iscc"

      - name: Build installer (publish src + self-sign + Inno)
        shell: pwsh
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          if ($env:CODE_SIGNING_PFX_BASE64 -and $env:CODE_SIGNING_PFX_PASSWORD) {
            New-Item -ItemType Directory -Force -Path artifacts/certs | Out-Null
            $pfx = Join-Path (Get-Location) 'artifacts\certs\codesign-secret.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGNING_PFX_BASE64))
            Write-Host "Using repository CODE_SIGNING_PFX secret"
            & pwsh -File src/scripts/Build-Installer.ps1 -Version $version -PfxPath $pfx -PfxPassword $env:CODE_SIGNING_PFX_PASSWORD
          } else {
            Write-Host "No CODE_SIGNING_PFX secret — generating ephemeral self-signed cert"
            & pwsh -File src/scripts/Build-Installer.ps1 -Version $version -GenerateCiCert
          }
          if ($LASTEXITCODE -ne 0) { throw "Build-Installer.ps1 failed: $LASTEXITCODE" }

      - name: Stage portable zip from publish tree
        shell: pwsh
        run: |
          $artifact = '${{ steps.meta.outputs.artifact_name }}'
          $stage = "artifacts/stage/$artifact"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "artifacts/publish/*" -Destination $stage -Recurse -Force
          Copy-Item LICENSE $stage -Force
          Copy-Item NOTICE $stage -Force
          Copy-Item docs/install/WINDOWS.md (Join-Path $stage 'README-INSTALL.md') -Force
          $zip = "artifacts/$artifact.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          Set-Content -Path artifacts/SHA256SUMS-portable.txt -Value ("{0}  {1}" -f $hash, (Split-Path $zip -Leaf)) -Encoding ascii
          Get-ChildItem artifacts -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/installer -Filter *.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $exe = "artifacts/publish/Waraq.Windows.App.exe"
          if (-not (Test-Path $exe)) {
            $exe = (Get-ChildItem artifacts/publish -Filter *.exe | Select-Object -First 1).FullName
          }
          foreach ($f in @($exe, $setup.FullName)) {
            $s = Get-AuthenticodeSignature -FilePath $f
            Write-Host "FILE $f"
            Write-Host "  Status=$($s.Status) Subject=$($s.SignerCertificate.Subject)"
            if (-not $s.SignerCertificate) { throw "No signature on $f" }
          }
          if ($setup.Length -lt 1MB) { throw "Setup.exe unexpectedly small" }

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}-portable
          path: |
            artifacts/${{ steps.meta.outputs.artifact_name }}.zip
            artifacts/SHA256SUMS-portable.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer + cert artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.setup_name }}
          path: |
            artifacts/installer/**
            artifacts/certs/*.cer
            artifacts/certs/*.CER
          if-no-files-found: error
          retention-days: 30

      - name: Draft GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/win-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          name: Waraq for Windows ${{ steps.meta.outputs.version }}
          body: |
            ## Waraq for Windows — ${{ steps.meta.outputs.version }} (WRQ-WIN-002)

            WinUI 3 parity app · GPL-3.0 · [install guide](https://github.com/taroo0ooq/waraq-windows/blob/main/docs/install/WINDOWS.md)

            ### Installer (recommended)
            1. Download `Waraq.Windows-Setup-win-x64-*.exe`
            2. Optional: import `WaraqWindows-CodeSigning.cer`
            3. Run Setup → Start Menu → Waraq for Windows

            ### Portable
            Extract zip → run `Waraq.Windows.App.exe`

            ### Notes
            - Self-signed Authenticode (SmartScreen may warn)
            - Self-contained .NET 8 + Windows App SDK
          files: |
            artifacts/${{ steps.meta.outputs.artifact_name }}.zip
            artifacts/SHA256SUMS-portable.txt
            artifacts/installer/*
            artifacts/certs/*.cer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draft GitHub Release (workflow_dispatch optional)
        if: github.event_name == 'workflow_dispatch' && inputs.create_draft_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-v${{ steps.meta.outputs.version }}
          draft: true
          prerelease: true
          generate_release_notes: true
          name: Waraq for Windows ${{ steps.meta.outputs.version }}
          body: |
            ## Waraq for Windows — ${{ steps.meta.outputs.version }}

            Phase 9 installer draft (WRQ-WIN-002).

            Install: [docs/install/WINDOWS.md](https://github.com/taroo0ooq/waraq-windows/blob/main/docs/install/WINDOWS.md)
          files: |
            artifacts/${{ steps.meta.outputs.artifact_name }}.zip
            artifacts/SHA256SUMS-portable.txt
            artifacts/installer/*
            artifacts/certs/*.cer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        shell: pwsh
        run: |
          @"
          ## windows-release (WRQ-WIN-002 Phase 9)

          - version: `${{ steps.meta.outputs.version }}`
          - portable: `${{ steps.meta.outputs.artifact_name }}.zip`
          - setup: `${{ steps.meta.outputs.setup_name }}.exe`
          - run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - install: ``docs/install/WINDOWS.md``
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
